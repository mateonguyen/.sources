<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="hexBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3a7fc1"/>
      <stop offset="100%" stop-color="#0f2747"/>
    </radialGradient>
    <radialGradient id="centerRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e83030"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <radialGradient id="outerRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#CC8800"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.45)"/>
    </filter>
    <clipPath id="hexClip">
      <!-- Regular hexagon, flat-top, r=232 -->
      <polygon points="256,24 488,140 488,372 256,488 24,372 24,140"/>
    </clipPath>
    <clipPath id="innerHexClip">
      <polygon points="256,68 444,162 444,350 256,444 68,350 68,162"/>
    </clipPath>
    <clipPath id="centerCircleClip">
      <circle cx="256" cy="256" r="118"/>
    </clipPath>
  </defs>

