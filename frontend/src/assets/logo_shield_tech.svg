<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 580" width="512" height="580">
  <defs>
    <radialGradient id="shieldRed" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e83030"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <radialGradient id="shieldGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a8a3e"/>
      <stop offset="100%" stop-color="#0f4a20"/>
    </radialGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a5a8a"/>
      <stop offset="100%" stop-color="#0f2747"/>
    </linearGradient>
    <filter id="shieldShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <filter id="starGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="shieldClip">
      <!-- Same shield shape for clipping -->
      <path d="M 256,28 L 432,90 L 432,310 Q 420,420 256,530 Q 92,420 80,310 L 80,90 Z"/>
    </clipPath>
    <pattern id="circuitPat" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <line x1="0"  y1="20" x2="40" y2="20" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
      <line x1="20" y1="0"  x2="20" y2="40" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
      <circle cx="20" cy="20" r="2.5" fill="rgba(255,255,255,0.18)"/>
      <circle cx="0"  cy="0"  r="1.5" fill="rgba(255,255,255,0.1)"/>
      <circle cx="40" cy="0"  r="1.5" fill="rgba(255,255,255,0.1)"/>
      <circle cx="0"  cy="40" r="1.5" fill="rgba(255,255,255,0.1)"/>
      <circle cx="40" cy="40" r="1.5" fill="rgba(255,255,255,0.1)"/>
      <!-- L-shaped circuit trace -->
      <polyline points="0,10 10,10 10,0" stroke="rgba(255,255,255,0.1)" stroke-width="0.8" fill="none"/>
      <polyline points="30,40 30,30 40,30" stroke="rgba(255,255,255,0.1)" stroke-width="0.8" fill="none"/>
    </pattern>
  </defs>

  <!-- ====== SHIELD OUTER GOLD BORDER ====== -->
  <path d="M 256,22 L 440,86 L 440,314 Q 428,432 256,538 Q 84,432 72,314 L 72,86 Z"
        fill="#FFD700"
        filter="url(#shieldShadow)"/>

  <!-- Shield red outline accent -->
  <path d="M 256,22 L 440,86 L 440,314 Q 428,432 256,538 Q 84,432 72,314 L 72,86 Z"
        fill="none" stroke="#CC0000" stroke-width="2.5"/>

  <!-- ====== SHIELD GREEN TOP BAND ====== -->
  <!-- Top green area (header) -->
  <path d="M 256,38 L 424,96 L 424,160 L 88,160 L 88,96 Z"
        fill="url(#shieldGreen)"
        clip-path="url(#shieldClip)"/>

  <!-- ====== SHIELD RED MAIN BODY ====== -->
  <path d="M 88,160 L 424,160 L 424,314 Q 412,424 256,524 Q 100,424 88,314 Z"
        fill="url(#shieldRed)"/>

  <!-- Circuit board pattern overlay on red body -->
  <path d="M 88,160 L 424,160 L 424,314 Q 412,424 256,524 Q 100,424 88,314 Z"
        fill="url(#circuitPat)"/>

  <!-- ====== RADIAL TECH RAYS FROM CENTER ====== -->
  <!-- Rays emanate from star position (256, 230) -->
  <g transform="translate(256,230)" clip-path="url(#shieldClip)" opacity="0.35">
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(0)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(20)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(40)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(60)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(80)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(100)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(120)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(140)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(160)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(180)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(200)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(220)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(240)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(260)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(280)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(300)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(320)"/>
    <line x1="0" y1="0" x2="0"    y2="-195" stroke="#FFD700" stroke-width="1.5" transform="rotate(340)"/>
  </g>

  <!-- ====== GOLD STAR (5-pointed), center (256, 230) ====== -->
  <!-- Outer R=70, Inner R=28 -->
  <!-- Outer: -90°,-18°,54°,126°,198° → 256+70*cos, 230+70*sin -->
  <!-- Top: (256,160) UR:(322.6,208.4) LR:(299.5,287.6) LL:(212.5,287.6) UL:(189.4,208.4) -->
  <!-- Inner (R=28): -54°,18°,90°,162°,234° -->
  <!-- (272.5,206.4) (282.6,238.7) (256,258) (229.4,238.7) (239.5,206.4) -->
  <polygon
    points="256,160 272,206 323,208 300,288 213,288 230,239 189,208 240,206"
    fill="#FFD700"
    stroke="none"
    filter="url(#starGlow2)"/>
  <!-- Recomputed more precisely -->
  <polygon
    points="256,160 272.5,206.4 322.6,208.4 299.5,287.6 256,258 212.5,287.6 213.4,208.4 239.5,206.4"
    fill="#FFD700" stroke="#CC8800" stroke-width="1.5" stroke-linejoin="round"
    filter="url(#starGlow2)"/>

  <!-- ====== HORIZONTAL SEPARATOR LINE ====== -->
  <line x1="88" y1="160" x2="424" y2="160" stroke="#FFD700" stroke-width="3"/>
  <line x1="88" y1="164" x2="424" y2="164" stroke="#CC0000" stroke-width="1"/>

  <!-- ====== GREEN HEADER TEXT ====== -->
  <!-- Small star symbols in header -->
  <text x="122" y="132" font-family="Arial" font-size="22" fill="#FFD700" text-anchor="middle">★</text>
  <text x="390" y="132" font-family="Arial" font-size="22" fill="#FFD700" text-anchor="middle">★</text>
  <!-- "CÔNG AN" in header -->
  <text x="256" y="126" font-family="'Arial Narrow', Arial, sans-serif" font-size="20"
        font-weight="bold" fill="#FFD700" text-anchor="middle" letter-spacing="3">
    CÔNG AN NHÂN DÂN
  </text>
  <text x="256" y="148" font-family="'Arial Narrow', Arial, sans-serif" font-size="13"
        fill="#FFD700" text-anchor="middle" letter-spacing="2" opacity="0.85">
    VIỆT NAM
  </text>

  <!-- ====== TECH ICON (chip/network) below star ====== -->
  <!-- Server/chip icon at (256, 350) -->
  <g transform="translate(256, 355)">
    <!-- Chip body -->
    <rect x="-30" y="-18" width="60" height="36" rx="4" ry="4"
          fill="none" stroke="#FFD700" stroke-width="2" opacity="0.8"/>
    <!-- Chip pins left -->
    <line x1="-40" y1="-10" x2="-30" y2="-10" stroke="#FFD700" stroke-width="2" opacity="0.7"/>
    <line x1="-40" y1="0"   x2="-30" y2="0"   stroke="#FFD700" stroke-width="2" opacity="0.7"/>
    <line x1="-40" y1="10"  x2="-30" y2="10"  stroke="#FFD700" stroke-width="2" opacity="0.7"/>
    <!-- Chip pins right -->
    <line x1="30" y1="-10" x2="40" y2="-10" stroke="#FFD700" stroke-width="2" opacity="0.7"/>
    <line x1="30" y1="0"   x2="40" y2="0"   stroke="#FFD700" stroke-width="2" opacity="0.7"/>
    <line x1="30" y1="10"  x2="40" y2="10"  stroke="#FFD700" stroke-width="2" opacity="0.7"/>
    <!-- Chip interior grid -->
    <line x1="-18" y1="-18" x2="-18" y2="18" stroke="#FFD700" stroke-width="0.8" opacity="0.5"/>
    <line x1="0"   y1="-18" x2="0"   y2="18" stroke="#FFD700" stroke-width="0.8" opacity="0.5"/>
    <line x1="18"  y1="-18" x2="18"  y2="18" stroke="#FFD700" stroke-width="0.8" opacity="0.5"/>
    <line x1="-30" y1="-6"  x2="30"  y2="-6" stroke="#FFD700" stroke-width="0.8" opacity="0.5"/>
    <line x1="-30" y1="6"   x2="30"  y2="6"  stroke="#FFD700" stroke-width="0.8" opacity="0.5"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#FFD700" opacity="0.9"/>
  </g>

  <!-- Connection lines from chip to side circuit nodes -->
  <g stroke="#FFD700" stroke-width="1" opacity="0.5" stroke-dasharray="4,4">
    <polyline points="216,355 180,355 168,330"/>
    <polyline points="296,355 332,355 344,330"/>
    <circle cx="168" cy="330" r="3" fill="#FFD700" opacity="0.7"/>
    <circle cx="344" cy="330" r="3" fill="#FFD700" opacity="0.7"/>
  </g>

  <!-- ====== NAVY BOTTOM BANNER ====== -->
  <path d="M 100,430 Q 256,450 412,430 L 412,470 Q 256,494 100,470 Z"
        fill="url(#bannerGrad)"
        clip-path="url(#shieldClip)"/>

  <!-- Banner text -->
  <text x="256" y="459" font-family="'Arial Narrow', Arial, sans-serif"
        font-size="16" font-weight="bold" fill="#FFD700" text-anchor="middle" letter-spacing="2">
    QUẢN LÝ CNTT
  </text>

  <!-- ====== SHIELD BORDER (final layer) ====== -->
  <path d="M 256,22 L 440,86 L 440,314 Q 428,432 256,538 Q 84,432 72,314 L 72,86 Z"
        fill="none" stroke="#FFD700" stroke-width="4"/>
  <path d="M 256,28 L 434,90 L 434,312 Q 422,428 256,532 Q 90,428 78,312 L 78,90 Z"
        fill="none" stroke="#CC0000" stroke-width="1.5"/>

  <!-- Corner circuit accents at shield top -->
  <g fill="#FFD700" opacity="0.8">
    <circle cx="92" cy="92" r="5"/>
    <circle cx="420" cy="92" r="5"/>
  </g>
  <g stroke="#FFD700" stroke-width="1.5" fill="none" opacity="0.6">
    <polyline points="92,92 92,110 110,110"/>
    <polyline points="420,92 420,110 402,110"/>
  </g>
</svg>
