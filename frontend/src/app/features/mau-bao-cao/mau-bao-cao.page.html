<app-section-card
  title="Mẫu báo cáo"
  subtitle="Quản lý danh sách mẫu báo cáo, tần suất và nhóm module sử dụng"
  styleClass="mau-bao-cao-card"
>
  <div sectionActions class="mau-bao-cao-actions">
    <button
      pButton
      type="button"
      icon="pi pi-plus"
      label="Thêm mẫu"
      class="p-button-primary app-page-primary-action"
      (click)="openCreate()"
    ></button>
    <button
      pButton
      type="button"
      icon="pi pi-refresh"
      label="Làm mới"
      class="p-button-secondary p-button-outlined"
      (click)="load()"
    ></button>
  </div>

  <div class="mau-shell mt-3">
    <app-loading-overlay
      [active]="loading"
      label="Đang tải mẫu báo cáo..."
    ></app-loading-overlay>

    <small class="app-validation-error" *ngIf="apiError">{{ apiError }}</small>

    <div class="filter-panel" *ngIf="!loading && items.length > 0">
      <div class="filter-container">
        <div class="filter-row">
          <div class="filter-group filter-group--lg">
            <label class="filter-label" for="mau-bao-cao-search"
              >Tìm kiếm</label
            >
            <input
              id="mau-bao-cao-search"
              pInputText
              type="text"
              placeholder="Nhập mã mẫu, tên mẫu hoặc module..."
              [(ngModel)]="searchTerm"
              (ngModelChange)="onFiltersChanged()"
              class="app-filter-input"
            />
          </div>

          <div class="filter-group filter-group--md">
            <label class="filter-label" for="mau-bao-cao-tan-suat"
              >Tần suất</label
            >
            <p-dropdown
              id="mau-bao-cao-tan-suat"
              [options]="tanSuatFilterOptions"
              [(ngModel)]="selectedTanSuat"
              optionLabel="label"
              optionValue="value"
              class="app-filter-select"
              appendTo="body"
              (onChange)="onFiltersChanged()"
            ></p-dropdown>
          </div>

          <div class="filter-group filter-group--md">
            <label class="filter-label" for="mau-bao-cao-status"
              >Trạng thái</label
            >
            <p-dropdown
              id="mau-bao-cao-status"
              [options]="statusFilterOptions"
              [(ngModel)]="selectedStatus"
              optionLabel="label"
              optionValue="value"
              class="app-filter-select"
              appendTo="body"
              (onChange)="onFiltersChanged()"
            ></p-dropdown>
          </div>

          <div class="filter-actions">
            <button
              pButton
              type="button"
              icon="pi pi-filter"
              class="p-button-info p-button-outlined p-button-sm action-icon-btn"
              (click)="onFiltersChanged()"
            ></button>
            <button
              pButton
              type="button"
              icon="pi pi-refresh"
              class="p-button-secondary p-button-outlined p-button-sm action-icon-btn"
              (click)="load()"
            ></button>
          </div>
        </div>
      </div>
    </div>

    <app-empty-state
      *ngIf="!loading && items.length === 0"
      title="Chưa có mẫu báo cáo"
      message="Tạo mẫu báo cáo đầu tiên để bắt đầu quản trị kỳ theo template."
      icon="pi pi-file-edit"
      actionLabel="Thêm mẫu"
      actionIcon="pi pi-plus"
      actionSeverity="primary"
      (action)="openCreate()"
    ></app-empty-state>

    <div class="table-section" *ngIf="!loading && items.length > 0">
      <app-empty-state
        *ngIf="filteredItems.length === 0"
        title="Không có kết quả phù hợp"
        message="Thử thay đổi từ khóa hoặc bộ lọc để xem lại danh sách mẫu báo cáo."
        icon="pi pi-filter-slash"
        actionLabel="Xóa bộ lọc"
        actionIcon="pi pi-times"
        (action)="resetFilters()"
      ></app-empty-state>

      <p-table
        *ngIf="filteredItems.length > 0"
        [value]="pagedItems"
        styleClass="p-datatable-sm app-admin-table mau-bao-cao-table"
        responsiveLayout="scroll"
        [tableStyle]="{ 'min-width': '72rem' }"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Mã mẫu</th>
            <th>Tên mẫu</th>
            <th>Tần suất</th>
            <th>Module</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
          <tr>
            <td>{{ item.maMau }}</td>
            <td>{{ item.tenMau }}</td>
            <td>{{ tanSuatLabel(item.tanSuat) }}</td>
            <td>
              <div class="module-tag-list">
                <span
                  class="module-tag"
                  *ngFor="let label of moduleLabels(item.danhSachModule).slice(0, 3)"
                >
                  {{ label }}
                </span>
                <span
                  class="module-tag module-tag--more"
                  *ngIf="item.danhSachModule.length > 3"
                  [pTooltip]="moduleLabels(item.danhSachModule).slice(3).join(', ')"
                  tooltipPosition="top"
                >
                  +{{ item.danhSachModule.length - 3 }}
                </span>
              </div>
            </td>
            <td>
              <div class="mau-status-cell">
                <span [class]="'status-badge ' + (item.isActive ? 'status-badge--dang-mo' : 'status-badge--da-dong')">
                  {{ item.isActive ? 'Hoạt động' : 'Ngừng' }}
                </span>
              </div>
            </td>
            <td>
              <div class="action-btns">
                <button
                  type="button"
                  class="action-btn action-btn--edit"
                  pTooltip="Chỉnh sửa"
                  tooltipPosition="top"
                  (click)="openEdit(item)"
                ><i class="pi pi-pencil"></i></button>
                <button
                  type="button"
                  class="action-btn action-btn--delete"
                  [disabled]="item.kyBaoCaoCount > 0"
                  [pTooltip]="item.kyBaoCaoCount > 0 ? 'Đang dùng cho ' + item.kyBaoCaoCount + ' kỳ — không thể xóa' : 'Xóa mẫu'"
                  tooltipPosition="top"
                  (click)="item.kyBaoCaoCount === 0 && delete(item)"
                ><i class="pi pi-trash"></i></button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>

      <div class="table-footer" *ngIf="filteredItems.length > 0">
        <span class="footer-info">{{ pagedSummary }}</span>

        <p-paginator
          [first]="first"
          [rows]="rows"
          [totalRecords]="filteredItems.length"
          styleClass="footer-paginator"
          (onPageChange)="onPageChange($event)"
        ></p-paginator>

        <div class="footer-rpp">
          <span class="rpp-label">Dòng/trang</span>
          <p-dropdown
            id="mau-bao-cao-page-size"
            [options]="pageSizeDropdownOptions"
            [(ngModel)]="rows"
            optionLabel="label"
            optionValue="value"
            class="app-filter-select footer-rpp-select"
            appendTo="body"
            (onChange)="onRowsChange()"
          ></p-dropdown>
        </div>
      </div>
    </div>

    <app-mau-bao-cao-upsert-dialog
      *ngIf="dialogVisible"
      [visible]="dialogVisible"
      [submitting]="saving"
      [mode]="dialogMode"
      [initialData]="dialogInitialData"
      [moduleCatalogGroups]="moduleCatalogGroups"
      (visibleChange)="onDialogVisibleChange($event)"
      (save)="onDialogSave($event)"
    ></app-mau-bao-cao-upsert-dialog>
  </div>
</app-section-card>
