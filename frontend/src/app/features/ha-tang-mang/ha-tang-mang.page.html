<app-tong-hop-mode-banner></app-tong-hop-mode-banner>
﻿<app-section-card
  title="Hạ Tầng Mạng"
  subtitle="Thống kê hạ tầng kết nối mạng của đơn vị. Nhấn vào chỉ số để chỉnh sửa, sau đó nhấn Lưu."
>
  <div class="relative">
    <app-loading-overlay
      [active]="loading()"
      label="Đang tải dữ liệu..."
    ></app-loading-overlay>
  </div>

  <ng-container *ngIf="row() as r">
    <!-- ── Metric section ── -->
    <div class="htmang-section htmang-section--metrics">
      <div class="htmang-section__head">
        <span class="htmang-section__title">Chỉ số hạ tầng</span>
        <span class="htmang-section__desc"
          >Nhập số liệu kết nối mạng của đơn vị</span
        >
      </div>

      <div class="htmang-metric-grid">
        <div class="htmang-metric-card htmang-metric-card--readonly">
          <span class="htmang-metric-card__label">Số ĐV trực thuộc</span>
          <p-inputNumber
            inputId="htmang-so-don-vi"
            [(ngModel)]="r.soDonViTrucThuoc"
            [useGrouping]="false"
            [min]="0"
            [allowEmpty]="false"
            [readonly]="true"
            [showButtons]="false"
            (ngModelChange)="updateReadonlyChildCount()"
          ></p-inputNumber>
        </div>

        <div
          class="htmang-metric-card"
          [class.htmang-metric-card--error]="isMetricExceeded('soDaKetNoiBcanet')"
        >
          <span class="htmang-metric-card__label">Đã kết nối BCANet</span>
          <p-inputNumber
            inputId="htmang-bcanet"
            [ngModel]="r.soDaKetNoiBcanet"
            [useGrouping]="false"
            [min]="0"
            [allowEmpty]="false"
            (ngModelChange)="updateMetricValue('soDaKetNoiBcanet', $event)"
          ></p-inputNumber>
          <span
            *ngIf="isMetricExceeded('soDaKetNoiBcanet')"
            class="htmang-metric-card__hint"
            >Vượt quá ĐV trực thuộc</span
          >
        </div>

        <div
          class="htmang-metric-card"
          [class.htmang-metric-card--error]="isMetricExceeded('soDuongTruyenVnpt')"
        >
          <span class="htmang-metric-card__label">Đường truyền VNPT</span>
          <p-inputNumber
            inputId="htmang-vnpt"
            [ngModel]="r.soDuongTruyenVnpt"
            [useGrouping]="false"
            [min]="0"
            [allowEmpty]="false"
            (ngModelChange)="updateMetricValue('soDuongTruyenVnpt', $event)"
          ></p-inputNumber>
          <span
            *ngIf="isMetricExceeded('soDuongTruyenVnpt')"
            class="htmang-metric-card__hint"
            >Vượt quá ĐV trực thuộc</span
          >
        </div>

        <div
          class="htmang-metric-card"
          [class.htmang-metric-card--error]="isMetricExceeded('soDuongTruyenKhac')"
        >
          <span class="htmang-metric-card__label">Đường truyền khác</span>
          <p-inputNumber
            inputId="htmang-khac"
            [ngModel]="r.soDuongTruyenKhac"
            [useGrouping]="false"
            [min]="0"
            [allowEmpty]="false"
            (ngModelChange)="updateMetricValue('soDuongTruyenKhac', $event)"
          ></p-inputNumber>
          <span
            *ngIf="isMetricExceeded('soDuongTruyenKhac')"
            class="htmang-metric-card__hint"
            >Vượt quá ĐV trực thuộc</span
          >
        </div>

        <div
          class="htmang-metric-card"
          [class.htmang-metric-card--error]="isMetricExceeded('soKetNoiInternet')"
        >
          <span class="htmang-metric-card__label">Kết nối Internet</span>
          <p-inputNumber
            inputId="htmang-internet"
            [ngModel]="r.soKetNoiInternet"
            [useGrouping]="false"
            [min]="0"
            [allowEmpty]="false"
            (ngModelChange)="updateMetricValue('soKetNoiInternet', $event)"
          ></p-inputNumber>
          <span
            *ngIf="isMetricExceeded('soKetNoiInternet')"
            class="htmang-metric-card__hint"
            >Vượt quá ĐV trực thuộc</span
          >
        </div>
      </div>
    </div>

    <!-- ── Ghi chú section ── -->
    <div class="htmang-section htmang-section--note">
      <div class="htmang-section__head">
        <span class="htmang-section__title">Ghi chú</span>
        <span class="htmang-section__desc">Thông tin bổ sung (nếu có)</span>
      </div>
      <label
        class="app-form-field app-form-field--textarea htmang-note-field"
        [class.has-value]="!!r.ghiChu.trim()"
      >
        <span class="app-form-field__label">Ghi chú</span>
        <textarea
          class="app-form-field__input htmang-note-input"
          [(ngModel)]="r.ghiChu"
          placeholder="Nhập ghi chú..."
          rows="4"
        ></textarea>
      </label>
    </div>

    <!-- ── Action bar ── -->
    <div class="htmang-actions">
      <button
        pButton
        type="button"
        icon="pi pi-refresh"
        label="Tải lại"
        severity="secondary"
        [loading]="loading()"
        (click)="load()"
      ></button>
      <button
        pButton
        type="button"
        icon="pi pi-save"
        label="Lưu dữ liệu"
        [loading]="saving()"
        [disabled]="saving() || hasValidationError()"
        (click)="save()"
      ></button>
    </div>
  </ng-container>
</app-section-card>
