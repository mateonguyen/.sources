<app-section-card
  title="Giam Sat NOC"
  subtitle="Ma tran giam sat NOC theo lop giam sat cho tung ky bao cao."
  styleClass="giamsat-card"
>
  <app-filter-bar class="mt-3">
    <form class="scope-filter" [formGroup]="filterForm">
      <p-inputNumber
        inputId="nocDonViId"
        [useGrouping]="false"
        formControlName="donViId"
        placeholder="Don vi id"
      ></p-inputNumber>

      <input
        pInputText
        type="text"
        formControlName="kyBaoCaoCode"
        placeholder="Ky bao cao code"
      />

      <button
        pButton
        type="button"
        icon="pi pi-search"
        class="p-button-info"
        label="Tai du lieu"
        (click)="load()"
      ></button>
    </form>
  </app-filter-bar>

  <div class="matrix-shell mt-3">
    <app-loading-overlay
      [active]="loading()"
      label="Dang tai ma tran giam sat NOC..."
    ></app-loading-overlay>

    <p class="matrix-hint">
      Co NOC duoc dong bo cho toan bo cac lop giam sat trong cung ky bao cao.
    </p>

    <div class="app-table-wrap app-table-wrap--spacious">
      <p-table
        [value]="rows()"
        styleClass="p-datatable-sm app-admin-table giamsat-matrix-table"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Lop giam sat</th>
            <th>Co NOC</th>
            <th>Thuc trang</th>
            <th>Nam thanh lap</th>
            <th>So nhan su</th>
            <th>Ghi chu</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td>{{ resolveLopGiamSatLabel(row.lopGiamSat) }}</td>
            <td>
              <p-checkbox
                [binary]="true"
                [ngModel]="row.coNoc"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="onCoNocChange($event)"
              ></p-checkbox>
            </td>
            <td>
              <p-dropdown
                [options]="thucTrangOptions()"
                optionLabel="label"
                optionValue="value"
                [ngModel]="row.thucTrang"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="row.thucTrang = $event"
                placeholder="Thuc trang"
                appendTo="body"
              ></p-dropdown>
            </td>
            <td>
              <p-inputNumber
                [useGrouping]="false"
                [ngModel]="row.namThanhLap"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="row.namThanhLap = $event"
                placeholder="Nam"
              ></p-inputNumber>
            </td>
            <td>
              <p-inputNumber
                [useGrouping]="false"
                [ngModel]="row.soNhanSu"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="row.soNhanSu = $event"
                placeholder="Nhan su"
              ></p-inputNumber>
            </td>
            <td>
              <input
                pInputText
                type="text"
                [ngModel]="row.ghiChu"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="row.ghiChu = $event"
                placeholder="Ghi chu"
              />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <app-form-action-bar class="mt-3">
      <button
        pButton
        type="button"
        label="Luu ma tran"
        [loading]="saving()"
        icon="pi pi-save"
        (click)="save()"
      ></button>
      <button
        pButton
        type="button"
        severity="secondary"
        label="Tai lai"
        icon="pi pi-refresh"
        (click)="load()"
      ></button>
    </app-form-action-bar>
  </div>
</app-section-card>
