<div class="login-wrap">
  <app-section-card
    title="Đăng nhập"
    subtitle="Đăng nhập vào tài khoản thành viên của bạn"
    styleClass="login-card"
  >
    <form [formGroup]="form" (ngSubmit)="submit()" class="p-fluid login-form">
      <div
        class="login-field"
        [class.has-value]="!!form.controls.username.value"
      >
        <label for="username" class="login-field__label">Tên đăng nhập *</label>
        <input
          pInputText
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          class="login-field__input"
        />
      </div>

      <div
        class="login-field"
        [class.has-value]="!!form.controls.password.value"
      >
        <label for="password" class="login-field__label">Mật khẩu</label>
        <p-password
          id="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full login-field__password"
          inputStyleClass="w-full login-field__input"
          autocomplete="current-password"
        ></p-password>
      </div>

      <div class="login-remember-me">
        <p-checkbox
          inputId="rememberMe"
          formControlName="rememberMe"
          [binary]="true"
        ></p-checkbox>
        <label for="rememberMe" class="login-remember-me__label">
          Ghi nhớ đăng nhập
        </label>
      </div>

      <small class="app-validation-error" *ngIf="showMfaWarning">
        Cảnh báo: Đây có vẻ là thiết bị mới. Bạn có thể cần xác thực bổ sung.
      </small>

      <small class="app-validation-error" *ngIf="error">{{ error }}</small>

      <button
        pButton
        type="submit"
        class="w-full login-submit"
        [loading]="loading"
        [label]="loading ? 'Đang xử lý...' : 'Đăng nhập'"
      ></button>
    </form>
  </app-section-card>
</div>
