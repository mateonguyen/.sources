<app-section-card
  title="Đổi mật khẩu"
  subtitle="Cập nhật mật khẩu đăng nhập của bạn"
  styleClass="account-card"
>
  <div class="cp-shell mt-3">
    <!-- Lưu ý -->
    <div class="cp-notice">
      <i class="pi pi-info-circle"></i>
      <span>Mật khẩu nên có tối thiểu 8 ký tự, bao gồm chữ cái và chữ số.</span>
    </div>

    <small class="app-validation-error display-block mb-2" *ngIf="apiError"
      >{{ apiError }}</small
    >

    <form class="cp-form" (ngSubmit)="submit()" #cpForm="ngForm">
      <!-- Mật khẩu hiện tại -->
      <div class="app-field required">
        <label for="currentPassword">Mật khẩu hiện tại</label>
        <div class="password-input-wrap">
          <input
            pInputText
            id="currentPassword"
            [type]="showCurrent ? 'text' : 'password'"
            [(ngModel)]="form.currentPassword"
            name="currentPassword"
            autocomplete="current-password"
            placeholder="Nhập mật khẩu hiện tại"
            required
            #currentCtrl="ngModel"
          />
          <button
            type="button"
            class="eye-toggle"
            (click)="showCurrent = !showCurrent"
            [attr.aria-label]="showCurrent ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            <i [class]="showCurrent ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
        <small
          class="app-validation-error"
          *ngIf="currentCtrl.invalid && (currentCtrl.touched || submitted)"
          >Vui lòng nhập mật khẩu hiện tại</small
        >
      </div>

      <!-- Mật khẩu mới -->
      <div class="app-field required">
        <label for="newPassword">Mật khẩu mới</label>
        <div class="password-input-wrap">
          <input
            pInputText
            id="newPassword"
            [type]="showNew ? 'text' : 'password'"
            [(ngModel)]="form.newPassword"
            name="newPassword"
            autocomplete="new-password"
            placeholder="Nhập mật khẩu mới"
            required
            minlength="8"
            #newCtrl="ngModel"
          />
          <button
            type="button"
            class="eye-toggle"
            (click)="showNew = !showNew"
            [attr.aria-label]="showNew ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            <i [class]="showNew ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
        <small
          class="app-validation-error"
          *ngIf="newCtrl.invalid && (newCtrl.touched || submitted)"
        >
          <ng-container *ngIf="newCtrl.errors?.['required']"
            >Vui lòng nhập mật khẩu mới</ng-container
          >
          <ng-container *ngIf="newCtrl.errors?.['minlength']"
            >Mật khẩu mới phải có ít nhất 8 ký tự</ng-container
          >
        </small>
      </div>

      <!-- Xác nhận mật khẩu mới -->
      <div class="app-field required">
        <label for="confirmPassword">Xác nhận mật khẩu mới</label>
        <div class="password-input-wrap">
          <input
            pInputText
            id="confirmPassword"
            [type]="showConfirm ? 'text' : 'password'"
            [(ngModel)]="form.confirmPassword"
            name="confirmPassword"
            autocomplete="new-password"
            placeholder="Nhập lại mật khẩu mới"
            required
            #confirmCtrl="ngModel"
          />
          <button
            type="button"
            class="eye-toggle"
            (click)="showConfirm = !showConfirm"
            [attr.aria-label]="showConfirm ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            <i [class]="showConfirm ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
        <small
          class="app-validation-error"
          *ngIf="(confirmCtrl.touched || submitted) && (confirmCtrl.errors?.['required'] || confirmMismatch)"
        >
          <ng-container *ngIf="confirmCtrl.errors?.['required']"
            >Vui lòng xác nhận mật khẩu mới</ng-container
          >
          <ng-container
            *ngIf="!confirmCtrl.errors?.['required'] && confirmMismatch"
            >Mật khẩu xác nhận không khớp</ng-container
          >
        </small>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button
          pButton
          type="submit"
          icon="pi pi-lock"
          label="Cập nhật mật khẩu"
          [loading]="saving"
        ></button>
        <button
          pButton
          type="button"
          icon="pi pi-refresh"
          label="Làm mới"
          class="p-button-secondary"
          [disabled]="saving"
          (click)="resetForm()"
        ></button>
      </div>
    </form>
  </div>
</app-section-card>
