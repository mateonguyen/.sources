name: thucluc-frontend

services:
  frontend:
    image: ${THUCLUC_FRONTEND_IMAGE:?Set THUCLUC_FRONTEND_IMAGE to an immutable version tag}
    container_name: thucluc-frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health/frontend"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
