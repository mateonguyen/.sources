name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ThucLuc.sln

      - name: Build (warnings as errors)
        run: dotnet build ThucLuc.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test ThucLuc.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Smoke tests
        run: dotnet test tests/Api.IntegrationTests/ThucLuc.Api.IntegrationTests.csproj --configuration Release --no-build --filter "Category=Smoke" --logger trx --results-directory TestResults/Smoke

      - name: Upload backend test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/TestResults/*.trx

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests (headless)
        run: npm run test:ci
